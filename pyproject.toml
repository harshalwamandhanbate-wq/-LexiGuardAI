[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lexiguard"
version = "1.0.0"
description = "Private On-Device Legal Document Triage Agent powered by Gemma"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "LexiGuard Contributors" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pypdf>=4.0.0",
    "pytest>=8.0.0",
    "psutil>=5.9.0",
    "python-multipart>=0.0.9",
    "jinja2>=3.1.0"
]

[project.scripts]
lexiguard = "lexiguard.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["lexiguard*"]
